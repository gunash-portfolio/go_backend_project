<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Go Backend Project</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <main class="shell">
    <p class="brand">Go Backend Project</p>
    <h1>Talk to the API</h1>
    <p class="lede">A small frontend for the Gorilla Mux server. Hit the button to call <code>/api/hello</code>.</p>
    <div class="actions">
      <button type="button" id="hello-btn">Call /api/hello</button>
    </div>
    <pre class="panel" id="response" aria-live="polite">Response will show up here.</pre>
  </main>
  <script src="/js/app.js"></script>
</body>
</html>
